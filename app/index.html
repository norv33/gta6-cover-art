<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice City <span>Cover Studio</span></h1>
    <p class="lede">Your photo + a caption, made into GTA-style cover art. Everything runs
    offline in this page — photos never leave your machine.</p>

    <label class="field">Photo for all panels
      <input id="photo-all" type="file" accept="image/*">
    </label>
    <div class="panels">
      <div class="panel-pick">
        <span>Hero panel</span>
        <input id="photo-0" type="file" accept="image/*" aria-label="Photo for hero panel">
        <button id="sample-0" type="button">Use sample</button>
      </div>
      <div class="panel-pick">
        <span>Panel 2</span>
        <input id="photo-1" type="file" accept="image/*" aria-label="Photo for panel 2">
        <button id="sample-1" type="button">Use sample</button>
      </div>
      <div class="panel-pick">
        <span>Panel 3</span>
        <input id="photo-2" type="file" accept="image/*" aria-label="Photo for panel 3">
        <button id="sample-2" type="button">Use sample</button>
      </div>
    </div>
    <p class="hint">Click a panel in the preview to select it, drag to pan it, scroll to zoom it.</p>

    <div class="panel-tabs" role="group" aria-label="Select panel to crop">
      <button type="button" data-panel="0">Hero</button>
      <button type="button" data-panel="1">Panel 2</button>
      <button type="button" data-panel="2">Panel 3</button>
      <span id="panel-name">Hero panel (big)</span>
    </div>
    <label class="field">Zoom <span id="zoom-val">1.00x</span>
      <input id="zoom" type="range" min="1" max="3" step="0.01" value="1">
    </label>
    <label class="field">Pan left / right
      <input id="panx" type="range" min="-0.5" max="0.5" step="0.01" value="0">
    </label>
    <label class="field">Pan up / down
      <input id="pany" type="range" min="-0.5" max="0.5" step="0.01" value="0">
    </label>

    <label class="field">Caption
      <input id="caption" type="text" maxlength="40" value="Sunset Heist">
    </label>
    <label class="field">Tag line
      <input id="tag" type="text" maxlength="24" value="Vice City">
    </label>
    <label class="field">Sunset grade <span id="grade-val">100%</span>
      <input id="grade" type="range" min="0" max="1" step="0.01" value="1">
    </label>
    <label class="field">Preview size
      <select id="size">
        <option value="square">1080 x 1080 (square)</option>
        <option value="portrait">1080 x 1350 (portrait)</option>
        <option value="wide">1920 x 1080 (wide)</option>
      </select>
    </label>

    <div class="exports">
      <button id="export-one" type="button" class="primary">Export this size as PNG</button>
      <button id="export-all" type="button">Export all 3 sizes (.zip)</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="stage" aria-label="Cover preview">
    <canvas id="preview" width="1080" height="1080" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
